<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Foviz - Home of Apt Skola | Scientific School Board Selection</title>
    <meta name="description" content="Stop guessing, start knowing. Foviz provides scientific 5D career analysis and IB vs CBSE board selection for students and professionals.">
    <meta name="keywords" content="career counseling India, career guidance, board selection CBSE vs IB, psychometric test for students, Foviz career GPS">

    <meta property="og:title" content="Foviz | Data-Driven Career Guidance">
    <meta property="og:description" content="Map your child's DNA to the right career path with our Elite 5D Analysis.">
    <meta property="og:url" content="https://foviz.in">
    <meta property="og:type" content="website">

    <link rel="canonical" href="https://foviz.in" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Foviz",
      "url": "https://foviz.in",
      "logo": "https://foviz.in/logo.png",
      "description": "India's most trusted career GPS providing school board selection and 5D psychometric career roadmaps.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "service": [
        {"@type": "Service", "name": "Apt Skola Board Selection"},
        {"@type": "Service", "name": "5D Career Analysis"}
      ]
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .animate-spin-slow { animation: spin 8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .transition-all { transition: all 0.3s ease; }
        .authority-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); }
        .overflow-x-auto { -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body>


    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Replace with your Google Apps Script Web App URL after deployment
        const googleScriptUrl = 'https://script.google.com/macros/s/AKfycbzmnO6I-uSi4mhOSsSYPlDB1yX3HjGkou0jmVair4YAZE0LOYbSV0nWER9iDrTBNP13hg/exec';

        if (googleScriptUrl === 'YOUR_GOOGLE_SCRIPT_URL') {
            console.warn("Google Sheets endpoint is not configured. Please replace 'YOUR_GOOGLE_SCRIPT_URL' with your actual Apps Script URL.");
        }

        const Icon = ({ name, className = "w-6 h-6", ...props }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className} aria-hidden="true" {...props}></i>;
        };

        const calculateCandidateScore = (answers, tabSwitchCount, pasteAttempted) => {
            const mcqValues = {
                q1: { A: 10, B: 0, C: 5, D: 0 },
                q2: { A: 10, B: 0, C: 5, D: 0 },
                q3: { A: 5, B: 10, C: 0, D: 0 },
                q5: { A: 10, B: 0, C: 0, D: 5 },
                q7: { A: 10, B: 0, C: 5, D: 0 },
                q8: { A: 0, B: 10, C: 5, D: 0 },
                q9: { A: 0, B: 10, C: 5, D: 0 }
            };

            let rawMcqScore = 0;
            const mcqKeys = ['q1', 'q2', 'q3', 'q5', 'q7', 'q8', 'q9'];
            mcqKeys.forEach(q => {
                const ans = answers[q];
                if (ans && mcqValues[q] && mcqValues[q][ans] !== undefined) {
                    rawMcqScore += mcqValues[q][ans];
                }
            });
            const mcqScore = Math.round((rawMcqScore / 70) * 60);

            // Text scoring
            const textAnswers = [answers.q4 || "", answers.q6 || "", answers.q10 || ""];
            let wordCountPoints = 0;
            let keywordPoints = 0;
            
            const keywords = ["visited", "called", "mapped", "followed up", "pitched", "pipeline", "network"];

            textAnswers.forEach(ans => {
                const cleanText = ans.trim();
                if (cleanText) {
                    const words = cleanText.split(/\s+/).filter(w => w.length > 0);
                    if (words.length >= 30) {
                        wordCountPoints += 3;
                    }
                    
                    const lowerText = cleanText.toLowerCase();
                    keywords.forEach(keyword => {
                        let matched = false;
                        if (keyword === "followed up") {
                            if (lowerText.includes("followed up") || lowerText.includes("follow up") || lowerText.includes("following up")) {
                                matched = true;
                            }
                        } else {
                            const regex = new RegExp(`\\b${keyword}\\b|\\b${keyword}ed\\b|\\b${keyword}ing\\b|\\b${keyword}s\\b`, 'i');
                            if (regex.test(lowerText) || lowerText.includes(keyword)) {
                                matched = true;
                            }
                        }
                        if (matched) {
                            keywordPoints += 2;
                        }
                    });
                }
            });

            const textScore = Math.min(30, wordCountPoints + keywordPoints);

            // Proctoring
            let proctoringScore = 10;
            if (tabSwitchCount > 2) proctoringScore -= 10;
            if (pasteAttempted) proctoringScore -= 5;
            proctoringScore = Math.max(0, proctoringScore);

            const finalScore = mcqScore + textScore + proctoringScore;

            let tier = "Tier 3: Low Match";
            if (finalScore >= 85) {
                tier = "Tier 1: High-Drive Hunter";
            } else if (finalScore >= 65) {
                tier = "Tier 2: Intern Performance Track";
            }

            const proctorFlags = [];
            if (tabSwitchCount > 2) proctorFlags.push(`Tab switches: ${tabSwitchCount}`);
            if (pasteAttempted) proctorFlags.push("Paste event intercepted");

            return {
                mcqScore,
                textScore,
                proctoringScore,
                finalScore,
                tier,
                proctorFlags
            };
        };

        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [showQuizModal, setShowQuizModal] = useState(false);
            const [showDiscoveryModal, setShowDiscoveryModal] = useState(false);
            const [showPartnerModal, setShowPartnerModal] = useState(false);
            const [showTermsModal, setShowTermsModal] = useState(false);
            const [showOrderIdModal, setShowOrderIdModal] = useState(false); 
            const [showCareerModal, setShowCareerModal] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [selectedCareerRole, setSelectedCareerRole] = useState("");
            const [testimonialTab, setTestimonialTab] = useState('parents');
            const [quizStep, setQuizStep] = useState(1);
            const [answers, setAnswers] = useState([]);

            // Assessment & Proctoring State
            const [showAssessmentModal, setShowAssessmentModal] = useState(false);
            const [careerPayload, setCareerPayload] = useState(null);
            const [tabSwitchCount, setTabSwitchCount] = useState(0);
            const [pasteAttempted, setPasteAttempted] = useState(false);
            const [assessmentStep, setAssessmentStep] = useState(0);
            const [assessmentAnswers, setAssessmentAnswers] = useState({});

            const aptSkolaUrl = "https://aptskola.com";
            const link499 = "https://nxtcue.edumilestones.com/login/suitability";
            const linkPremium = "https://careertest.edumilestones.com/student-dashboard/suitability-registration/login/MzA1Nw==/as11-as12-as13-as14-vas341-hms341-as204-as16";

            useEffect(() => {
                if (showAssessmentModal) {
                    document.title = "Candidate Assessment | Foviz Careers";
                } else if (showQuizModal) {
                    document.title = "Discover Your Path | Foviz Career Quiz";
                } else {
                    document.title = "Foviz | Home of Apt Skola | Scientific School Board Selection";
                }
            }, [showQuizModal, showAssessmentModal]);

            // Proctoring window blur tracker
            useEffect(() => {
                if (showAssessmentModal) {
                    const handleBlur = () => {
                        setTabSwitchCount(prev => prev + 1);
                    };
                    window.addEventListener('blur', handleBlur);
                    return () => {
                        window.removeEventListener('blur', handleBlur);
                    };
                } else {
                    // Reset on close
                    setTabSwitchCount(0);
                    setPasteAttempted(false);
                    setAssessmentStep(0);
                    setAssessmentAnswers({});
                }
            }, [showAssessmentModal]);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const ref = params.get('ref');
                if (ref) {
                    localStorage.setItem('foviz_ref', ref);
                }
            }, []);

            const handlePaymentRedirect = (baseUrl) => {
                const refCode = localStorage.getItem('foviz_ref');
                const url = new URL(baseUrl);
                if (refCode) {
                    url.searchParams.append('ref', refCode);
                }
                window.open(url.toString(), '_blank');
            };

             const handleSubmit = async (e, formName, callback) => {
                e.preventDefault();
                setIsSubmitting(true);
                const formData = new FormData(e.target);

                if (googleScriptUrl === 'YOUR_GOOGLE_SCRIPT_URL') {
                    alert("Submission failed: Google Sheets URL is not configured. Please add your Apps Script URL in the code.");
                    return;
                }

                try {
                    let payload = { formName: formName };

                    if (formName === "career-application") {
                        const file = formData.get("resume");
                        let base64Data = "";
                        let fileName = "";
                        let fileType = "";

                        if (file && file.size > 0) {
                            fileName = file.name;
                            fileType = file.type;
                            
                            const readAsBase64 = (f) => new Promise((resolve, reject) => {
                                const reader = new FileReader();
                                reader.readAsDataURL(f);
                                reader.onload = () => resolve(reader.result.split(',')[1]);
                                reader.onerror = (error) => reject(error);
                            });
                            
                            base64Data = await readAsBase64(file);
                        }

                        const currentRole = formData.get("role");
                        const initialPayload = {
                            formName: formName,
                            name: formData.get("name"),
                            phone: formData.get("phone"),
                            role: currentRole,
                            linkedin: formData.get("linkedin") || "",
                            whyFit: formData.get("whyFit"),
                            resumeData: base64Data,
                            resumeName: fileName,
                            resumeType: fileType
                        };

                        if (currentRole === "BD Intern" || currentRole === "Management Trainee") {
                            setCareerPayload(initialPayload);
                            setShowCareerModal(false);
                            setShowAssessmentModal(true);
                            setIsSubmitting(false);
                            return; // Stop submission here; proceed to assessment modal
                        }

                        payload = initialPayload;
                    } else if (formName === "discovery-call") {
                        payload = {
                            formName: formName,
                            name: formData.get("name"),
                            phone: formData.get("phone"),
                            school: formData.get("school"),
                            time: formData.get("time")
                        };
                    } else if (formName === "partner-registration") {
                        payload = {
                            formName: formName,
                            name: formData.get("name"),
                            phone: formData.get("phone"),
                            organization: formData.get("organization"),
                            time: formData.get("time")
                        };
                    } else if (formName === "elite-redirection") {
                        payload = {
                            formName: formName,
                            orderId: formData.get("orderId"),
                            source: formData.get("source") || "Direct"
                        };
                    }

                    // Post JSON payload directly to the Google Web App script URL
                    // Using no-cors mode to bypass redirect CORS limitations of Google Apps Script
                    await fetch(googleScriptUrl, {
                        method: "POST",
                        mode: "no-cors",
                        headers: {
                            "Content-Type": "text/plain"
                        },
                        body: JSON.stringify(payload)
                    });

                    // In no-cors mode, the response is opaque, so we cannot check status or parse JSON.
                    // We invoke the callback assuming success if the fetch promise resolves without throwing.
                    callback();
                } catch (error) {
                    console.error("Google Sheets Submission Error:", error);
                    alert("Something went wrong during submission: " + (error.message || error));
                } finally {
                    setIsSubmitting(false);
                }
            };

            const submitAssessment = (answers) => {
                setIsSubmitting(true);
                const scoreResult = calculateCandidateScore(answers, tabSwitchCount, pasteAttempted);
                
                const finalPayload = {
                    ...careerPayload,
                    calculatedScore: scoreResult.finalScore,
                    candidateTier: scoreResult.tier,
                    tabSwitchCount: tabSwitchCount,
                    proctorFlags: JSON.stringify(scoreResult.proctorFlags),
                    q1: answers.q1 || "",
                    q2: answers.q2 || "",
                    q3: answers.q3 || "",
                    q4: answers.q4 || "",
                    q5: answers.q5 || "",
                    q6: answers.q6 || "",
                    q7: answers.q7 || "",
                    q8: answers.q8 || "",
                    q9: answers.q9 || "",
                    q10: answers.q10 || ""
                };

                // Close modal and stop loading immediately
                setShowAssessmentModal(false);
                setIsSubmitting(false);

                // Show alert right away
                alert("Application submitted! Our recruitment team will review your profile and reach out within 3 business days.");

                // Fire request in the background with keepalive
                fetch(googleScriptUrl, {
                    method: "POST",
                    mode: "no-cors",
                    keepalive: true,
                    headers: {
                        "Content-Type": "text/plain"
                    },
                    body: JSON.stringify(finalPayload)
                }).catch((error) => {
                    console.error("Google Sheets Submission Error (Background):", error);
                });
            };

            const startQuiz = () => {
                setQuizStep(1);
                setAnswers([]);
                setShowQuizModal(true);
                setIsMenuOpen(false);
            };

            const testimonials = {
                parents: [
                    { name: "Nagaraju Veesam", title: "Gained clarity", quote: "I wanted to thank Foviz for the guidance and support provided during the career counseling session for my daughter. Their approach made a significant positive impact.", rating: 5 },
                    { name: "Swagtika Parida", title: "Hidden strengths", quote: "An outstanding experience. This session provided a clear vision of career options best suited for our child’s mental ability. A true blessing.", rating: 5 },
                    { name: "Praveen Bussa", title: "Highly impressed", quote: "I liked the way they guided our child and made him understand the options ahead. I am really impressed with the approach.", rating: 5 }
                ],
                professionals: [
                    { name: "Ahi Juices", title: "Aligned Interests", quote: "I recently underwent career counseling to evaluate whether I am in the right profession. Results perfectly aligned with my interests.", rating: 5 },
                    { name: "Deepika Sumana Tokala", title: "Confidential", quote: "The counselor was very professional and created a safe space to express myself freely. Confidentiality was maintained throughout.", rating: 5 }
                ],
                graduates: [
                    { name: "Yashwanth Babu", title: "Expert insights", quote: "Harish sir provided excellent career counseling with personalized guidance and expert insights. Helped me gain clarity and confidence.", rating: 5 },
                    { name: "Yugendhar Yugendhar", title: "Truly appreciated", quote: "I am so happy I approached Foviz. I truly appreciate the way they took the time to understand me and my needs.", rating: 5 },
                    { name: "Sayeeda Khatoon", title: "New opportunities", quote: "I explored unknown facts about myself through the career counseling exam. Learned about many new career opportunities possible after graduation.", rating: 5 },
                    { name: "Md Rumana", title: "Mind-blowing", quote: "To be honest, this session was mind-blowing. It was incredibly helpful for me, and I suggest it to everyone looking for a way forward.", rating: 5 }
                ]
            };

            const quizQuestions = [
                { id: 1, question: "What is your child’s current grade level?", options: [{ label: "Below Grade 5 to Grade 8", weight: 'board' }, { label: "Grade 8 to Grade 10", weight: 'board' }, { label: "Grade 10 to Undergraduate", weight: 'career' }] },
                { id: 2, question: "What is your #1 concern right now?", options: [{ label: "Choosing the right school board / curriculum.", weight: 'board' }, { label: "Choosing the right career path or higher education stream.", weight: 'career' }] },
                { id: 3, question: "How does your child feel about school right now?", options: [{ label: "Struggling in the wrong curriculum / school board.", weight: 'board' }, { label: "Uncertain about what stream or career to target.", weight: 'career' }] },
                { id: 4, question: "If you had one 'Superpower' for your child's education?", options: [{ label: "Pick the perfect board foundation (CBSE, IB, IGCSE, etc.).", weight: 'board' }, { label: "Get a clear 10-year career roadmap.", weight: 'career' }] },
                { id: 5, question: "Is there conflict at home regarding the future path?", options: [{ label: "Very little, we just want to select the right school board.", weight: 'board' }, { label: "Yes, we have disagreements about stream/career choices.", weight: 'career' }] }
            ];

            const handleAnswer = (weight) => {
                const updatedAnswers = [...answers, weight];
                setAnswers(updatedAnswers);
                if (quizStep === 5) setQuizStep(7);
                else setQuizStep(prev => prev + 1);
            };

            const getResult = () => {
                const counts = answers.reduce((acc, curr) => { acc[curr] = (acc[curr] || 0) + 1; return acc; }, {});
                const majority = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b, 'career');
                
                if (majority === 'board') return { 
                    title: "Architect (Apt Skola)", 
                    description: "Optimized for students choosing between CBSE, IB, and IGCSE boards.", 
                    hook: "Build the foundation.", 
                    link: aptSkolaUrl, 
                    isExternal: true, 
                    cta: "Go to Apt Skola" 
                };
                return { 
                    title: "Strategist (5D Analysis)", 
                    description: "Strategic career mapping for senior students and professionals using 5-dimensional psychometric analysis.",
                    hook: "The Final Roadmap.", 
                    link: "#pricing", 
                    isExternal: false, 
                    cta: "View Packages" 
                };
            };

            const currentResult = quizStep === 7 ? getResult() : null;

            const navLinks = [
                { id: 'ecosystem', label: 'Ecosystem', href: '#ecosystem' },
                { id: 'about', label: 'About Us', href: '#about' },
                { id: 'sample-report', label: 'Sample Report', href: '#sample-report' },
                { id: 'pricing', label: 'Pricing', href: '#pricing' },
                { id: 'careers', label: 'Careers', href: '#careers' },
                { id: 'partner', label: 'Educator Partner Program', href: '#educatorPartner' }
            ];

            return (
                <div className="min-h-screen bg-white">
                    {/* Discovery Call Modal */}
                    {showDiscoveryModal && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-lg rounded-[32px] p-8 lg:p-10 relative shadow-2xl">
                                <button onClick={() => setShowDiscoveryModal(false)} className="absolute top-6 right-6 p-2 text-slate-400 hover:text-indigo-950 transition-colors">
                                    <Icon name="x" />
                                </button>
                                <div className="text-center mb-8">
                                    <h3 className="text-2xl font-black text-indigo-950">Book Your Discovery Call</h3>
                                    <p className="text-slate-500 text-sm mt-2">Fill in your details below and our team will get in touch with you shortly.</p>
                                </div>
                                <form 
                                    name="discovery-call" 
                                    method="POST"
                                    data-netlify="true"
                                    className="space-y-4" 
                                    onSubmit={(e) => handleSubmit(e, "discovery-call", () => {
                                        alert("Success! Our team will contact you shortly for your Discovery Call.");
                                        setShowDiscoveryModal(false);
                                    })}
                                >
                                    <input type="hidden" name="form-name" value="discovery-call" />
                                    <input type="hidden" name="bot-field" />
                                    
                                    <input type="text" name="name" placeholder="Full Name" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600" required />
                                    <input type="tel" name="phone" placeholder="WhatsApp Number" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600" required />
                                    <input type="text" name="school" placeholder="School Name" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600" required />
                                    <select name="time" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600" required>
                                        <option value="">Ideal Time for Conversation</option>
                                        <option>Morning (9 AM - 12 PM)</option>
                                        <option>Afternoon (12 PM - 4 PM)</option>
                                        <option>Evening (4 PM - 8 PM)</option>
                                    </select>
                                    <button 
                                        type="submit" 
                                        disabled={isSubmitting} 
                                        className={`w-full bg-indigo-950 text-white py-5 rounded-2xl font-black text-lg shadow-xl mt-4 transition-all ${isSubmitting ? 'opacity-70 cursor-not-allowed' : 'hover:bg-indigo-900'}`}
                                    >
                                        {isSubmitting ? "Submitting..." : "Schedule Call"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Order ID Modal (Elite Redirection) */}
                    {showOrderIdModal && (
                        <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-md rounded-[32px] p-8 relative shadow-2xl">
                                <button onClick={() => setShowOrderIdModal(false)} className="absolute top-6 right-6 p-2 text-slate-400 hover:text-indigo-950 transition-colors">
                                    <Icon name="x" />
                                </button>
                                <div className="text-center mb-8">
                                    <div className="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <Icon name="ticket" className="text-orange-500 w-8 h-8" />
                                    </div>
                                    <h3 className="text-2xl font-black text-indigo-950">Verify Your Reward</h3>
                                    <p className="text-slate-500 text-sm mt-2">Please enter your Apt Skola Order ID to claim the 50% discount.</p>
                                </div>
                                <form 
                                    name="elite-redirection" 
                                    method="POST"
                                    data-netlify="true"
                                    className="space-y-4" 
                                    onSubmit={(e) => {
                                        handleSubmit(e, "elite-redirection", () => {
                                            handlePaymentRedirect(linkPremium);
                                            setShowOrderIdModal(false);
                                        });
                                    }}
                                >
                                    <input type="hidden" name="form-name" value="elite-redirection" />
                                    <input type="hidden" name="source" value="Elite Experience Reward Section" />
                                    
                                    <input 
                                        type="text" 
                                        name="orderId" 
                                        placeholder="Enter Order ID (e.g., AS-12345)" 
                                        className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-orange-500 font-bold" 
                                        required 
                                    />
                                    <button 
                                        type="submit" 
                                        disabled={isSubmitting} 
                                        className={`w-full bg-orange-500 text-white py-5 rounded-2xl font-black text-lg shadow-xl hover:bg-orange-600 transition-all ${isSubmitting ? 'opacity-70 cursor-not-allowed' : ''}`}
                                    >
                                        {isSubmitting ? "Verifying..." : "Verify & Proceed"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Partner Registration Modal */}
                    {showPartnerModal && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-lg rounded-[32px] p-8 lg:p-10 relative shadow-2xl">
                                <button onClick={() => setShowPartnerModal(false)} className="absolute top-6 right-6 p-2 text-slate-400 hover:text-indigo-950 transition-colors">
                                    <Icon name="x" />
                                </button>
                                <div className="text-center mb-8">
                                    <h3 className="text-2xl font-black text-indigo-950">Partner Registration</h3>
                                    <p className="text-slate-500 text-sm mt-2">Join our network of educators. Please provide your professional details.</p>
                                </div>
                                <form 
                                    name="partner-registration" 
                                    method="POST"
                                    data-netlify="true"
                                    className="space-y-4" 
                                    onSubmit={(e) => handleSubmit(e, "partner-registration", () => {
                                        alert("Registration complete! A partnership manager will reach out to you within 24 hours.");
                                        setShowPartnerModal(false);
                                    })}
                                >
                                    <input type="hidden" name="form-name" value="partner-registration" />
                                    <input type="hidden" name="bot-field" />

                                    <input type="text" name="name" placeholder="Full Name" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600" required />
                                    <input type="tel" name="phone" placeholder="WhatsApp Number" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600" required />
                                    <input type="text" name="organization" placeholder="Organization / School Name" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600" required />
                                    <select name="time" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600" required>
                                        <option value="">Best Time to Connect</option>
                                        <option>During School Hours</option>
                                        <option>Post-School Hours</option>
                                        <option>Weekends</option>
                                    </select>
                                    <button 
                                        type="submit" 
                                        disabled={isSubmitting} 
                                        className={`w-full bg-orange-600 text-white py-5 rounded-2xl font-black text-lg shadow-xl mt-4 transition-all ${isSubmitting ? 'opacity-70 cursor-not-allowed' : 'hover:bg-orange-500'}`}
                                    >
                                        {isSubmitting ? "Submitting..." : "Submit Registration"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Partner Terms Modal */}
                    {showTermsModal && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-lg rounded-[32px] p-8 lg:p-10 relative shadow-2xl">
                                <button onClick={() => setShowTermsModal(false)} className="absolute top-6 right-6 p-2 text-slate-400 hover:text-indigo-950 transition-colors">
                                    <Icon name="x" />
                                </button>
                                <div className="text-center mb-8">
                                    <h3 className="text-2xl font-black text-indigo-950">Partner Payout Policy</h3>
                                    <p className="text-slate-500 text-sm mt-4 leading-relaxed">
                                        All referral payouts are processed within <strong className="font-bold text-indigo-950">7 business days</strong> of a verified customer payment. Our system tracks referrals via unique partner IDs to ensure transparency and prompt remuneration for our educator network.
                                    </p>
                                </div>
                                <button onClick={() => setShowTermsModal(false)} className="w-full bg-indigo-950 text-white py-4 rounded-xl font-black text-lg shadow-xl">I Understand</button>
                            </div>
                        </div>
                    )}

                    {/* Career Application Modal */}
                    {showCareerModal && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-lg rounded-[32px] p-8 lg:p-10 relative shadow-2xl overflow-y-auto max-h-[90vh]">
                                <button onClick={() => setShowCareerModal(false)} className="absolute top-6 right-6 p-2 text-slate-400 hover:text-indigo-950 transition-colors">
                                    <Icon name="x" />
                                </button>
                                <div className="text-center mb-8">
                                    <h3 className="text-2xl font-black text-indigo-950">Join Our Team</h3>
                                    <p className="text-slate-500 text-sm mt-2">Scale career clarity across schools in India.</p>
                                </div>
                                <form 
                                    name="career-application" 
                                    method="POST"
                                    data-netlify="true"
                                    encType="multipart/form-data"
                                    className="space-y-4" 
                                    onSubmit={(e) => handleSubmit(e, "career-application", () => {
                                        alert("Application submitted! Our recruitment team will review your profile and reach out within 3 business days.");
                                        setShowCareerModal(false);
                                    })}
                                >
                                    <input type="hidden" name="form-name" value="career-application" />
                                    <input type="hidden" name="bot-field" />
                                    
                                    <input type="text" name="name" placeholder="Full Name" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 font-medium" required />
                                    <input type="tel" name="phone" placeholder="WhatsApp Number" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 font-medium" required />
                                    
                                    <select 
                                        name="role" 
                                        value={selectedCareerRole}
                                        onChange={(e) => setSelectedCareerRole(e.target.value)}
                                        className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 font-medium" 
                                        required
                                    >
                                        <option value="">Select Role Applied For</option>
                                        <option value="BD Intern">Business Development Intern</option>
                                        <option value="Management Trainee">Management Trainee - Sales & B2B</option>
                                    </select>
                                    
                                    <input type="text" name="linkedin" placeholder="LinkedIn Profile / Portfolio URL" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 font-medium" />
                                    
                                    <div className="space-y-1">
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block pl-1 text-left">Attach Resume (PDF / Word)</label>
                                        <input 
                                            type="file" 
                                            name="resume" 
                                            accept=".pdf,.doc,.docx" 
                                            className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 font-bold text-slate-500 text-left file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-indigo-950 file:text-white hover:file:bg-indigo-900 cursor-pointer file:transition-all" 
                                            required 
                                        />
                                    </div>
                                    
                                    <textarea name="whyFit" placeholder="Why are you a good fit for this role?" rows="4" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 font-medium" required></textarea>
                                    
                                    <button 
                                        type="submit" 
                                        disabled={isSubmitting} 
                                        className={`w-full bg-indigo-950 text-white py-5 rounded-2xl font-black text-lg shadow-xl mt-4 transition-all ${isSubmitting ? 'opacity-70 cursor-not-allowed' : 'hover:bg-indigo-900'}`}
                                    >
                                        {isSubmitting ? "Submitting..." : "Submit Application"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Assessment Modal */}
                    {showAssessmentModal && (
                        <div className="fixed inset-0 z-[130] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-3xl rounded-[32px] p-8 lg:p-10 relative shadow-2xl overflow-y-auto max-h-[90vh]">
                                <button onClick={() => {
                                    if(confirm("Are you sure you want to exit? Your progress and test attempt will be lost.")) {
                                        setShowAssessmentModal(false);
                                    }
                                }} className="absolute top-6 right-6 p-2 text-slate-400 hover:text-indigo-950 transition-colors">
                                    <Icon name="x" />
                                </button>

                                {/* Notice: Answers are screened... */}
                                <div className="bg-orange-50 border border-orange-200 rounded-2xl p-4 mb-6 text-orange-800 text-sm font-semibold flex items-start gap-3">
                                    <Icon name="alert-triangle" className="w-5 h-5 text-orange-600 flex-shrink-0 mt-0.5" />
                                    <span>Notice: Answers are screened using semantic checks and proctoring metrics. AI-generated text or copy-pasting will result in instant disqualification.</span>
                                </div>

                                {/* Warning banner if tabSwitchCount > 2 */}
                                {tabSwitchCount > 2 && (
                                    <div className="bg-red-50 border border-red-200 rounded-2xl p-4 mb-6 text-red-800 text-sm font-bold flex items-start gap-3 animate-pulse">
                                        <Icon name="alert-octagon" className="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5" />
                                        <span>Warning: Multiple tab switches/window blurs detected ({tabSwitchCount} times). This test attempt has been flagged for proctoring review.</span>
                                    </div>
                                )}

                                {assessmentStep === 0 && (
                                    <div className="space-y-6">
                                        <div className="text-center">
                                            <h3 className="text-3xl font-black text-indigo-950">Candidate Assessment</h3>
                                            <p className="text-slate-500 mt-2">For: {careerPayload?.role || "Business Development Position"}</p>
                                        </div>
                                        <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-4">
                                            <h4 className="font-bold text-indigo-950 text-lg">Test Rules & Guidelines:</h4>
                                            <ul className="list-disc pl-5 text-sm text-slate-600 space-y-2">
                                                <li>This test consists of 10 questions. You will complete them one-by-one.</li>
                                                <li>Selecting an option in multiple-choice questions will automatically transition you to the next question.</li>
                                                <li><strong>Proctoring:</strong> Leaving this window or switching tabs will be tracked. If you leave this window more than 2 times, your score will be heavily penalized.</li>
                                                <li><strong>Anti-Paste:</strong> Copying and pasting is disabled. You must type out all open text answers manually.</li>
                                                <li>Your answers will be graded by our scoring engine in real-time.</li>
                                            </ul>
                                        </div>
                                        <button 
                                            onClick={() => setAssessmentStep(1)} 
                                            className="w-full bg-indigo-950 text-white py-5 rounded-2xl font-black text-lg shadow-xl hover:bg-indigo-900 transition-all"
                                        >
                                            Start Assessment
                                        </button>
                                    </div>
                                )}

                                {assessmentStep >= 1 && assessmentStep <= 10 && (() => {
                                    const handleMcqSelect = (questionId, optionKey) => {
                                        setAssessmentAnswers(prev => ({ ...prev, [questionId]: optionKey }));
                                        setTimeout(() => {
                                            setAssessmentStep(prev => prev + 1);
                                        }, 250);
                                    };

                                    // Define questions
                                    const questionsData = {
                                        1: {
                                            section: "Section 1: Resilience & Patience",
                                            desc: "Dealing with persistent outreach and follow-ups.",
                                            type: "mcq",
                                            question: "1. You have followed up three times with a school Principal regarding the Apt Skola board suitability analysis but haven't received any response. What is your next step?",
                                            options: [
                                                { key: 'A', text: 'Visit the school in person during public hours, introduce yourself to the receptionist/coordinator, and request a 5-minute meeting or identify the best time to reach the Principal.' },
                                                { key: 'B', text: 'Continue to call the Principal\'s mobile number multiple times a day until they answer.' },
                                                { key: 'C', text: 'Send a formal email asking if they are uninterested so you can remove them from your list.' },
                                                { key: 'D', text: 'Mark the lead as dead and immediately stop all outreach efforts.' }
                                            ]
                                        },
                                        2: {
                                            section: "Section 1: Resilience & Patience",
                                            desc: "Handling objections and client rejections.",
                                            type: "mcq",
                                            question: "2. A school Principal rejects your pitch, stating they already have a career counselor and do not need Foviz. How do you handle this?",
                                            options: [
                                                { key: 'A', text: 'Politely acknowledge their current solution, ask what gaps they still face, and offer to share a sample of our unique 5D diagnostic report for comparison.' },
                                                { key: 'B', text: 'Argue that their current counselor lacks scientific 5D depth and they are doing a disservice to students.' },
                                                { key: 'C', text: 'Offer to discount the Elite package by 50% immediately to win them over.' },
                                                { key: 'D', text: 'Accept the rejection immediately and exit the call.' }
                                            ]
                                        },
                                        3: {
                                            section: "Section 2: Hard Work vs. Smart Work",
                                            desc: "Time management and sales productivity.",
                                            type: "mcq",
                                            question: "3. You have an 8-hour workday. How would you plan your time to maximize school closures for Apt Skola?",
                                            options: [
                                                { key: 'A', text: 'Spend the entire day making cold calls to a list of schools found on Google.' },
                                                { key: 'B', text: 'Research and pre-qualify 5 high-potential schools, schedule 2 in-person visits, and spend the remaining time following up on warm leads.' },
                                                { key: 'C', text: 'Spend 6 hours building a highly customized presentation slide deck and 2 hours on administrative tasks.' },
                                                { key: 'D', text: 'Wait at your desk for inbound leads or referrals to come through the website.' }
                                            ]
                                        },
                                        4: {
                                            section: "Section 2: Hard Work vs. Smart Work",
                                            desc: "Productivity, planning, and long-term goal setting.",
                                            type: "text",
                                            question: "4. Describe a goal you worked toward for 6+ months without immediate reward. What kept you driven daily? (Min 30 words)"
                                        },
                                        5: {
                                            section: "Section 3: Aspirations & Drive",
                                            desc: "Inner motivation and career objectives.",
                                            type: "mcq",
                                            question: "5. What is your primary motivation for choosing a target-driven sales and business development role?",
                                            options: [
                                                { key: 'A', text: 'The opportunity to control my earnings through uncapped performance commissions and fast-track my career growth.' },
                                                { key: 'B', text: 'Having a steady job with predictable hours and comfortable routine tasks.' },
                                                { key: 'C', text: 'Traveling to different schools and networking without the pressure of hard sales targets.' },
                                                { key: 'D', text: 'Helping students find their career path, with commission as a secondary benefit.' }
                                            ]
                                        },
                                        6: {
                                            section: "Section 3: Aspirations & Drive",
                                            desc: "Bootstrapping sales and generating pipeline with zero budget.",
                                            type: "text",
                                            question: "6. With zero ad budget, how would you generate your first 15 qualified school leads? (Min 30 words)"
                                        },
                                        7: {
                                            section: "Section 4: B2B Sales Aptitude",
                                            desc: "Handling value and pricing objections.",
                                            type: "mcq",
                                            question: "7. A Principal says the ₹2,499 Foviz Elite package is too expensive for their students. How do you respond?",
                                            options: [
                                                { key: 'A', text: 'Highlight that ₹2,499 is a one-time investment in a 15-year career roadmap that prevents costly educational mistakes, and offer custom bulk school pricing options.' },
                                                { key: 'B', text: 'Apologize for the high price and ask if they can recommend any wealthier students.' },
                                                { key: 'C', text: 'Immediately suggest the ₹499 Starter package instead, to make a quick sale.' },
                                                { key: 'D', text: 'Tell them that quality career guidance cannot be cheap and walk away if they can\'t afford it.' }
                                            ]
                                        },
                                        8: {
                                            section: "Section 4: B2B Sales Aptitude",
                                            desc: "Executing discovery calls with school administrators.",
                                            type: "mcq",
                                            question: "8. During a 15-minute discovery call with a school Principal, what should be your main objective?",
                                            options: [
                                                { key: 'A', text: 'Pitch every single feature of the 36-page Foviz Elite report.' },
                                                { key: 'B', text: 'Understand the school\'s specific challenges regarding student career stream selection and parent satisfaction.' },
                                                { key: 'C', text: 'Negotiate pricing, payment splits, and contract terms.' },
                                                { key: 'D', text: 'Share your own achievements and background in sales.' }
                                            ]
                                        },
                                        9: {
                                            section: "Section 4: B2B Sales Aptitude",
                                            desc: "Estimating conversion funnels in B2B transactions.",
                                            type: "mcq",
                                            question: "9. If your target is to close 3 school-wide Apt Skola sessions this month, what size pipeline is required?",
                                            options: [
                                                { key: 'A', text: '3 schools, since you plan to pitch only to interested schools.' },
                                                { key: 'B', text: '30-45 qualified school leads, assuming a realistic B2B conversion rate of 7-10%.' },
                                                { key: 'C', text: '10 schools, assuming a standard 30% closing rate.' },
                                                { key: 'D', text: '100+ unverified email addresses scraped from the web.' }
                                            ]
                                        },
                                        10: {
                                            section: "Section 4: B2B Sales Aptitude",
                                            desc: "Managing sales recovery and target deficits.",
                                            type: "text",
                                            question: "10. If you fall behind target by Week 3, what exact steps will you take in Week 4? (Min 30 words)"
                                        }
                                    };

                                    const q = questionsData[assessmentStep];
                                    const currentAns = assessmentAnswers[`q${assessmentStep}`] || "";

                                    return (
                                        <div className="space-y-6">
                                            <div className="flex items-center gap-2 mb-2">
                                                <div className="h-1 flex-1 bg-slate-100 rounded-full overflow-hidden">
                                                    <div className="h-full bg-indigo-600 transition-all duration-500" style={{ width: `${(assessmentStep / 10) * 100}%` }}></div>
                                                </div>
                                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Question {assessmentStep}/10</span>
                                            </div>



                                            {q.type === "mcq" ? (
                                                <div className="space-y-4 text-left">
                                                    <label className="text-base font-bold text-indigo-950 block">{q.question}</label>
                                                    <div className="grid gap-3">
                                                        {q.options.map(opt => (
                                                            <button 
                                                                key={opt.key}
                                                                type="button"
                                                                onClick={() => handleMcqSelect(`q${assessmentStep}`, opt.key)}
                                                                className={`text-left p-4 rounded-xl border-2 font-semibold transition-all flex items-start gap-3 ${currentAns === opt.key ? 'border-indigo-600 bg-indigo-50/50 text-indigo-950' : 'border-slate-100 hover:border-indigo-600/30 text-slate-600'}`}
                                                            >
                                                                <span className="font-bold uppercase bg-slate-200 text-slate-700 w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 text-sm mt-0.5">{opt.key}</span>
                                                                <span>{opt.text}</span>
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="space-y-2 text-left">
                                                    <label className="text-base font-bold text-indigo-950 block">{q.question}</label>
                                                    <textarea 
                                                        rows="4" 
                                                        value={currentAns}
                                                        onPaste={(e) => { 
                                                            e.preventDefault(); 
                                                            setPasteAttempted(true);
                                                            alert("Pasting is disabled. Please type your answer manually."); 
                                                        }}
                                                        onChange={(e) => setAssessmentAnswers(prev => ({ ...prev, [`q${assessmentStep}`]: e.target.value }))}
                                                        placeholder="Write your response here manually..."
                                                        className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 font-medium animate-none"
                                                    ></textarea>
                                                    <div className="text-right text-xs font-semibold text-slate-400">
                                                        Word count: {(currentAns.trim().split(/\s+/).filter(w => w.length > 0).length)} (Need 30+)
                                                    </div>
                                                </div>
                                            )}

                                            <div className="flex justify-between gap-4 mt-8 pt-4 border-t border-slate-100">
                                                <button 
                                                    type="button"
                                                    onClick={() => setAssessmentStep(prev => prev - 1)}
                                                    className="px-6 py-3 border border-slate-200 text-slate-600 hover:bg-slate-50 font-bold rounded-xl text-sm transition-all"
                                                >
                                                    Back
                                                </button>
                                                {q.type === "text" && (
                                                    <button 
                                                        type="button"
                                                        onClick={() => {
                                                            if (!currentAns.trim()) {
                                                                alert("Please answer the question before proceeding.");
                                                                return;
                                                            }
                                                            if (assessmentStep === 10) {
                                                                submitAssessment(assessmentAnswers);
                                                            } else {
                                                                setAssessmentStep(prev => prev + 1);
                                                            }
                                                        }}
                                                        className="px-8 py-3 bg-indigo-950 text-white font-bold rounded-xl text-sm hover:bg-indigo-900 transition-all ml-auto animate-none"
                                                    >
                                                        {assessmentStep === 10 ? "Submit Application" : "Continue"}
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        </div>
                    )}

                    {/* Quiz Modal */}
                    {showQuizModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-2xl rounded-[32px] p-8 relative shadow-2xl overflow-y-auto max-h-[90vh]">
                                <button onClick={() => setShowQuizModal(false)} className="absolute top-6 right-6 p-2 text-slate-400 hover:text-indigo-950 transition-colors">
                                    <Icon name="x" />
                                </button>
                                {quizStep <= 5 && (
                                    <div className="space-y-6">
                                        <div className="flex items-center gap-2 mb-2">
                                            <div className="h-1 flex-1 bg-slate-100 rounded-full overflow-hidden">
                                                <div className="h-full bg-indigo-600 transition-all duration-500" style={{ width: `${(quizStep / 5) * 100}%` }}></div>
                                            </div>
                                            <span className="text-[10px] font-black text-slate-400">STEP {quizStep}/5</span>
                                        </div>
                                        <h3 className="text-2xl font-black text-indigo-950 leading-tight">{quizQuestions[quizStep-1].question}</h3>
                                        <div className="grid gap-3">
                                            {quizQuestions[quizStep-1].options.map((opt, i) => {
                                                const letter = String.fromCharCode(65 + i); // A, B, C...
                                                return (
                                                    <button key={i} onClick={() => handleAnswer(opt.weight)} className="text-left p-6 rounded-2xl border-2 border-slate-100 hover:border-indigo-600 hover:bg-indigo-50 font-bold transition-all group">
                                                        <span className="group-hover:text-indigo-950 text-slate-600">{letter}) {opt.label}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                                {quizStep === 7 && currentResult && (
                                    <div className="text-center space-y-6 py-4 animate-in zoom-in duration-500">
                                        <div className="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-2 text-green-600">
                                            <Icon name="award" className="w-12 h-12" />
                                        </div>
                                        <span className="text-orange-500 font-black uppercase text-[10px] tracking-widest">Recommended Path</span>
                                        <h3 className="text-3xl font-black text-indigo-950 leading-tight">{currentResult.title}</h3>
                                        <p className="text-sm text-slate-400 font-bold -mt-2">{currentResult.description}</p>
                                        <p className="text-lg text-slate-600 italic">"{currentResult.hook}"</p>
                                        <div className="flex flex-col gap-3">
                                            <button onClick={() => { if(currentResult.isExternal) handlePaymentRedirect(currentResult.link); else document.getElementById('pricing')?.scrollIntoView({behavior:'smooth'}); setShowQuizModal(false); }} className="w-full bg-orange-500 text-white py-5 rounded-2xl font-black text-xl shadow-xl shadow-orange-500/20">{currentResult.cta}</button>
                                            <button onClick={() => {setShowQuizModal(false); setShowDiscoveryModal(true);}} className="w-full py-4 border-2 border-slate-100 rounded-2xl font-bold text-slate-600 hover:border-indigo-600 transition-all flex items-center justify-center gap-2">
                                                <Icon name="calendar-days" className="w-5 h-5 text-indigo-500" />
                                                Book 1-on-1 Session
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Navigation */}
                    <nav className="fixed w-full z-50 bg-white/95 border-b border-slate-100 h-20 flex items-center">
                        <div className="max-w-7xl mx-auto px-6 w-full flex justify-between items-center">
                            {/* Task 1: Re-aligned Stacked Logo */}
                            <div 
                                className="flex flex-col cursor-pointer group" 
                                onClick={() => window.scrollTo({top:0, behavior:'smooth'})}
                            >
                                <span className="text-3xl font-[900] text-indigo-950 tracking-tighter leading-none">
                                    FOVIZ<span className="text-orange-500">.</span>
                                </span>
                                <span className="text-[10px] font-black uppercase tracking-[0.15em] text-orange-500 mt-1">
                                    Home of Apt Skola
                                </span>
                            </div>
                            
                            <div className="hidden lg:flex space-x-10 items-center">
                                {navLinks.map(link => (
                                    <a key={link.id} href={link.href} className="font-bold text-slate-500 hover:text-indigo-950 uppercase text-[10px] tracking-widest transition-colors">{link.label}</a>
                                ))}
                                <button onClick={startQuiz} className="bg-indigo-950 text-white px-7 py-3 rounded-full font-bold text-sm hover:shadow-xl hover:shadow-indigo-950/20 transition-all uppercase tracking-widest text-[10px]">Book a Discovery call</button>
                            </div>

                            <button className="lg:hidden p-2" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                <Icon name={isMenuOpen ? "x" : "menu"} />
                            </button>
                        </div>
                        {isMenuOpen && (
